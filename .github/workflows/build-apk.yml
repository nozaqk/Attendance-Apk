name: Build APK

# Builds the single native Android app (Kotlin + Jetpack Compose) that contains
# both portals — Lecturer and Student — in one APK. There is no WebView and no
# web build step: the app talks to the backend directly.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build native APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # The run log download host is not always reachable for tooling, so on
      # failure the compiler output is also posted on the pull request, which
      # keeps the exact Kotlin/Gradle errors readable.
      - name: Report build errors on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=android/build.log
          [ -f "$LOG" ] || exit 0
          {
            echo '### Build failed'
            echo '```'
            grep -E "e: file://|^e: |error:|What went wrong|FAILURE:|Execution failed|Could not resolve|Caused by" -m 200 "$LOG" || tail -n 120 "$LOG"
            echo '```'
          } > /tmp/report.md
          head -c 60000 /tmp/report.md > /tmp/report.trim.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/report.trim.md || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-attendance-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
