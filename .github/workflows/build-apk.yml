name: Build APK

# Builds the single native Android app (Kotlin + Jetpack Compose) that contains
# both portals — Lecturer and Student — in one APK. There is no WebView and no
# web build step: the app talks to the backend directly.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build native APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # `setup-android` installs the long-removed "tools" SDK package by default, which makes
      # the step fail on today's runners. Ask it for nothing, then install what we need below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: android
        env:
          # Repo variable: Settings → Secrets and variables → Actions → Variables
          # API_BASE_URL = https://yourdomain.com  (public value, not a secret)
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://attendance-system-33pl.onrender.com' }}
        run: |
          echo "Building APK against API_BASE_URL=$API_BASE_URL"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # The run log download host is not always reachable for tooling, so on
      # failure the compiler output is also posted on the pull request, which
      # keeps the exact Kotlin/Gradle errors readable.
      - name: Report build errors on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=android/build.log
          [ -f "$LOG" ] || exit 0
          {
            echo '### Build failed'
            echo '```'
            grep -E "e: file://|^e: |error:|What went wrong|FAILURE:|Execution failed|Could not resolve|Caused by" -m 200 "$LOG" || tail -n 120 "$LOG"
            echo '```'
          } > /tmp/report.md
          head -c 60000 /tmp/report.md > /tmp/report.trim.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/report.trim.md || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-attendance-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish latest APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Latest APK" \
              --notes "Latest Smart Attendance APK built from ${GITHUB_SHA}."
          fi

  # Release-variant build, kept as a separate job so it can be tested on its own:
  # "Run workflow" → this job builds `assembleRelease` and uploads the APK as an artifact.
  # No keystore is configured yet, so Gradle signs it with the debug key (installable for
  # testing, NOT for distribution). Add the KEYSTORE_* secrets and the signing config
  # already reads them — nothing else here has to change.
  release:
    name: Build release APK (test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # `setup-android` installs the long-removed "tools" SDK package by default, which makes
      # the step fail on today's runners. Ask it for nothing, then install what we need below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build release APK
        working-directory: android
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://attendance-system-33pl.onrender.com' }}
          # Signing variables are intentionally absent for now: the release build falls back
          # to the debug key. When the keystore is ready, restore it from
          # secrets.KEYSTORE_BASE64 and set KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS /
          # KEY_PASSWORD here.
        run: |
          echo "Building release APK against API_BASE_URL=$API_BASE_URL"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee release-build.log
          exit ${PIPESTATUS[0]}

      - name: Show what was produced
        if: success()
        working-directory: android
        run: |
          ls -l app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" || true

      - name: Report release build errors on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=android/release-build.log
          [ -f "$LOG" ] || exit 0
          {
            echo '### Release build failed'
            echo '```'
            grep -E "e: file://|^e: |error:|What went wrong|FAILURE:|Execution failed|Could not resolve|Caused by" -m 200 "$LOG" || tail -n 120 "$LOG"
            echo '```'
          } > /tmp/release-report.md
          head -c 60000 /tmp/release-report.md > /tmp/release-report.trim.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/release-report.trim.md || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-attendance-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
