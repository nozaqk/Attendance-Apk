name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this build as a downloadable GitHub prerelease
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test and build Dart app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          cache: true

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Dart tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://attendance-system-33pl.onrender.com' }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartiq-flutter-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp mobile/build/app/outputs/flutter-apk/app-release.apk smartiq-latest.apk
          NOTES="SmartIQ Flutter app built from ${GITHUB_SHA:0:7}. This test build is signed with the debug key and is not intended for store distribution."
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release upload latest smartiq-latest.apk --repo "$REPO" --clobber
            gh release view latest --repo "$REPO" --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                if [[ -n "$name" && "$name" != "smartiq-latest.apk" ]]; then
                  gh release delete-asset latest "$name" --repo "$REPO" --yes
                fi
              done
            gh release edit latest --repo "$REPO" --title "SmartIQ - latest APK" --notes "$NOTES"
          else
            gh release create latest smartiq-latest.apk \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "SmartIQ - latest APK" \
              --notes "$NOTES"
          fi

      - name: Publish branch build as a downloadable prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="smartiq-${GITHUB_SHA:0:7}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk smartiq.apk
          NOTES="Installable SmartIQ Android test build from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}. Both lecturer and student portals are included. This APK is debug-signed and is not for Play Store distribution. Download smartiq.apk, allow installs from your browser or file manager, then open it to install."
          gh release create "$TAG" smartiq.apk \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "SmartIQ APK ($TAG)" \
            --notes "$NOTES" \
            --prerelease
