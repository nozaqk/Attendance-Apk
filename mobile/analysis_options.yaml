include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # The UI mirrors a fixed design system built from small widgets; const
    # constructors are nice-to-have, not a correctness rule.
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    use_build_context_synchronously: false

analyzer:
  errors:
    # Keep the build honest: missing imports, unknown members and type errors
    # fail; style hints only warn.
    unused_import: warning
